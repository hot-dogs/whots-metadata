name: WHOTS Metadata

on:
  schedule:
    - cron: "0 0 1 * *" # 00:00 UTC on the 1st each month
  workflow_dispatch: # allow manual runs
  push:
    paths-ignore:
      - ".github/.keepalive" # avoid re-trigger from our keepalive commit
      - "results/items.json" # avoid loops if results change

permissions:
  contents: write # needed to push commits

concurrency:
  group: whots-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Reliable Conda setup (avoid touching base)
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: false
          activate-environment: whots-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          remove-profiles: true
          clean-patched-environment-file: true
          run-post: true

      - name: Create/update environment from environment.yml
        shell: bash -l {0}
        run: |
          # Update the named env from your environment.yml
          mamba env update -n whots-${{ matrix.python-version }} -f environment.yml
          conda info --envs
          which python
          python --version
          mamba list | head -n 50

      - name: Verify scrapy is available
        shell: bash -l {0}
        run: |
          which scrapy || true
          scrapy version

      - name: Fetch latest WHOTS data
        shell: bash -l {0}
        working-directory: ./src/whots_metadata
        run: |
          scrapy crawl whotsmetadata -O ../../results/items.json

      - name: Commit and push changes (with keepalive fallback)
        shell: bash -l {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Stage real changes first
          git add -A
          if git diff --cached --quiet; then
            # Nothing changed — write/update a keepalive file so repo has activity
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git add .github/.keepalive
            git commit -m "[skip ci] keepalive: prevent schedule disable"
          else
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "[skip ci] Latest WHOTS Metadata: ${timestamp}"
          fi

          git push
