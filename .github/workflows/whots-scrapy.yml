name: WHOTS Metadata

on:
  schedule:
    - cron: "0 0 1 * *" # 00:00 UTC on the 1st each month
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github/.keepalive"
      - "results/items.json"
      - "results/whots_metadata.json"

permissions:
  contents: write

concurrency:
  group: whots-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Conda setup (avoid touching base; create a named env)
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate: true
          activate-environment: whots-${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          remove-profiles: true
          run-post: true

      # Remove name/prefix before CI env update so generated files stay outside the repo.
      - name: Sanitize environment.yml for CI
        shell: bash -l {0}
        run: |
          awk 'BEGIN{IGNORECASE=1} !/^[[:space:]]*name[[:space:]]*:/ && !/^[[:space:]]*prefix[[:space:]]*:/ {print}' environment.yml > "$RUNNER_TEMP/environment_ci.yml"
          echo "----- environment_ci.yml -----"
          cat "$RUNNER_TEMP/environment_ci.yml"

      - name: Create/Update env from sanitized file
        shell: bash -l {0}
        run: |
          mamba env update -n whots-${{ matrix.python-version }} -f "$RUNNER_TEMP/environment_ci.yml"
          conda info --envs
          which python
          python --version
          mamba list | head -n 50

      - name: Verify scrapy is available
        shell: bash -l {0}
        run: |
          which scrapy || true
          scrapy version

      - name: Run parser tests
        shell: bash -l {0}
        run: |
          make test

      - name: Fetch latest WHOTS data
        shell: bash -l {0}
        run: |
          rm -f results/whots_metadata.json
          make crawl

      - name: Commit and push changes (with keepalive fallback)
        shell: bash -l {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git add .
          if git diff --cached --quiet; then
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
            git add .github/.keepalive
            git commit -m "[skip ci] keepalive: prevent schedule disable"
          else
            timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "[skip ci] Latest WHOTS Metadata: ${timestamp}"
          fi
          git push
